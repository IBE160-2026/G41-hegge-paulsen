<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartØkt</title>
    <link rel="stylesheet" href="./src/app/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <p class="eyebrow">SmartØkt</p>
        <h1>Treningsøkt tilpasset deg</h1>
      </header>

      <section class="card">
        <form id="workout-form">
          <div class="field-group">
            <label for="time">Tilgjengelig tid</label>
            <select id="time" name="time">
              <option value="15">15 min</option>
              <option value="20">20 min</option>
              <option value="30" selected>30 min</option>
              <option value="40">40 min</option>
              <option value="45">45 min</option>
              <option value="60">60 min</option>
            </select>
          </div>

          <div class="field-group">
            <label for="focus">Fokus</label>
            <select id="focus" name="focus">
              <option value="styrke" selected>Styrke</option>
              <option value="kondisjon">Kondisjon</option>
              <option value="generell">Generell helse</option>
            </select>
          </div>

          <div class="field-group">
            <label for="energy">Energinivå</label>
            <select id="energy" name="energy">
              <option value="low">Lav</option>
              <option value="medium" selected>Middels</option>
              <option value="high">Høy</option>
            </select>
          </div>

          <button type="submit">Få øktforslag</button>
        </form>
      </section>

      <section class="result-grid">
        <article class="card result-card">
          <h2>Øktforslag</h2>
          <p id="suggestion-title" class="big-text">Laster...</p>
          <ul id="suggestion-exercises" class="exercise-list"></ul>
          <p id="suggestion-duration" class="meta"></p>
          <p id="suggestion-intensity" class="meta"></p>
          <p id="suggestion-notes" class="notes"></p>
        </article>

        <article class="card result-card">
          <h2>Neste vekt</h2>
          <p id="next-weight" class="big-text">Laster...</p>
          <p id="next-weight-message" class="notes"></p>
        </article>

        <article class="card result-card">
          <h2>Treningsstatus</h2>
          <p class="meta">Økter totalt: <strong id="progress-total">0</strong></p>
          <p class="meta">Gjennomsnittlig belastning: <strong id="progress-average">0 kg</strong></p>
          <p class="meta">Siste fokus: <strong id="progress-focus">Ingen</strong></p>
          <p id="progress-trend" class="notes">Logg minst to økter for å se utvikling.</p>
          <ul id="progress-list" class="exercise-list"></ul>
        </article>
      </section>

      <section class="card log-card">
        <h2>Logg økt</h2>
        <form id="workout-log-form" class="log-form">
          <div class="field-group">
            <label for="log-date">Dato</label>
            <input id="log-date" name="log-date" type="date" />
          </div>

          <div class="field-group">
            <label for="log-focus">Fokus</label>
            <select id="log-focus" name="log-focus">
              <option value="styrke">Styrke</option>
              <option value="kondisjon">Kondisjon</option>
              <option value="generell">Generell helse</option>
            </select>
          </div>

          <div class="field-group">
            <label for="log-duration">Varighet</label>
            <input id="log-duration" name="log-duration" type="number" min="10" max="120" value="30" />
          </div>

          <div class="field-group">
            <label for="log-load">Belastning (kg)</label>
            <input id="log-load" name="log-load" type="number" min="0" step="5" value="80" />
          </div>

          <div class="field-group">
            <label for="log-performance">Opplevelse</label>
            <select id="log-performance" name="log-performance">
              <option value="good">Bra</option>
              <option value="fair">Middels</option>
              <option value="easy">Lett</option>
            </select>
          </div>

          <button type="submit">Legg til økt</button>
        </form>
      </section>
    </main>

    <script type="module" src="./src/app/ui.js"></script>
  </body>
</html>
